# Site
title: "Jason Kou"
subtitle: "AI automation · local tools · content"
name: "Jason Kou"
description: "Jason Kou — AI agents and automation, offline models on Apple Silicon, and the videos and write-ups that come out of it."
url: "https://jasonkou.com"
baseurl: ""
repository: "Jason-Kou/JK_AI_Automation"
locale: "en-US"
timezone: "Asia/Shanghai"
title_separator: "-"
words_per_minute: 300

# Theme
remote_theme: "mmistakes/minimal-mistakes@4.27.1"
minimal_mistakes_skin: "dark"

# Author
author:
  name: "Jason Kou"
  avatar: # "/assets/images/avatar.jpg"
  bio: "AI agents, automation, and local models — turned into open-source tools and videos."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Jason-Kou"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/jason-kou"
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/@jason_kou"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Jason-Kou"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/jason-kou"
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/@jason_kou"

# Build
include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
encoding: "utf-8"
markdown: kramdown
highlighter: rouge
permalink: /:year/:title/

kramdown:
  input: GFM
  auto_ids: true
  toc_levels: 1..3
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

comments:
  provider: false
analytics:
  provider: false

compress_html:
  clippings: all

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false # ponytail: 中文没空格，Jekyll 的按词计数算不准
      share: true
      toc: true
      toc_label: "目录"
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # 中文版：站点默认英文，/zh/ 下的页面换中文导航
  - scope:
      path: "_pages/zh"
      type: pages
    values:
      nav: main_zh
      home_url: /zh/
      subtitle: "AI 自动化 · 本地工具 · 内容创作"
